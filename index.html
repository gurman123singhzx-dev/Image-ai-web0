<!DOCTYPE html>
<html>
<head>
  <title>Image Q&A AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-color: #0f172a;
      --chat-bg: #1e293b;
      --user-color: #3b82f6;
      --ai-color: #facc15;
      --text-color: white;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      transition: all 0.3s;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    #toggleMode {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
    }

    input[type="text"] {
      width: 70%;
      margin-right: 5px;
    }

    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #2563eb;
    }

    #preview {
      margin: 10px 0;
      border-radius: 12px;
      border: 2px solid #3b82f6;
      max-width: 90%;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    #chat {
      max-height: 500px;
      overflow-y: auto;
      padding: 15px;
      border-radius: 16px;
      background: var(--chat-bg);
      margin-top: 20px;
      text-align: left;
      transition: background 0.3s;
    }

    .msg {
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 20px;
      max-width: 80%;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.3);
      animation: fadeIn 0.3s;
    }

    .user-msg {
      background: var(--user-color);
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
      border-bottom-left-radius: 20px;
      transform: translateX(50%);
      animation: slideInRight 0.3s forwards;
    }

    .ai-msg {
      background: var(--ai-color);
      color: black;
      margin-right: auto;
      border-bottom-left-radius: 4px;
      border-bottom-right-radius: 20px;
      transform: translateX(-50%);
      animation: slideInLeft 0.3s forwards;
    }

    .timestamp {
      font-size: 10px;
      opacity: 0.7;
      position: absolute;
      bottom: -14px;
      right: 10px;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInLeft { from { opacity:0; transform: translateX(-50%); } to { opacity:1; transform: translateX(0); } }
    @keyframes slideInRight { from { opacity:0; transform: translateX(50%); } to { opacity:1; transform: translateX(0); } }

    .typing {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 2px;
      background: black;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
</head>
<body>

  <button id="toggleMode">Toggle Mode</button>
  <h2>Image Q&A AI</h2>

  <div>
    <input type="file" id="imageInput" accept="image/*" capture="environment"><br>
    <img id="preview">
  </div>

  <div style="margin-top:10px;">
    <input type="text" id="question" placeholder="Ask a question...">
    <button onclick="askQuestion()">Ask</button>
  </div>

  <div id="chat"></div>

  <script>
    const input = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const chat = document.getElementById("chat");
    const toggleBtn = document.getElementById("toggleMode");

    if(localStorage.getItem("chatData")) {
      chat.innerHTML = localStorage.getItem("chatData");
      chat.scrollTop = chat.scrollHeight;
    }

    function saveChat() {
      localStorage.setItem("chatData", chat.innerHTML);
    }

    toggleBtn.addEventListener("click", () => {
      if (getComputedStyle(document.body).backgroundColor === "rgb(15, 23, 42)") {
        document.body.style.background = "#f1f5f9";
        chat.style.background = "#e2e8f0";
        document.body.style.color = "#111827";
      } else {
        document.body.style.background = "#0f172a";
        chat.style.background = "#1e293b";
        document.body.style.color = "white";
      }
    });

    input.addEventListener("change", () => {
      const file = input.files[0];
      if (file) preview.src = URL.createObjectURL(file);
    });

    function getTimeStamp() {
      const now = new Date();
      return now.getHours() + ":" + (now.getMinutes()<10?'0':'') + now.getMinutes();
    }

    function addMessage(text, type, typing=false) {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      const timestamp = `<span class="timestamp">${getTimeStamp()}</span>`;
      if (typing) {
        div.innerHTML = `<b>AI:</b> <span class="typing"><span></span><span></span><span></span></span> ${timestamp}`;
      } else {
        div.innerHTML = `${text} ${timestamp}`;
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      saveChat();
      return div;
    }

    function askQuestion() {
      const file = input.files[0];
      const question = document.getElementById("question").value;
      if (!file) { alert("Please upload an image first!"); return; }
      if (!question) { alert("Please type a question!"); return; }

      addMessage(`<b>You:</b> ${question}`, "user-msg");

      Tesseract.recognize(file, 'eng')
        .then(({ data: { text } }) => {
          const aiBubble = addMessage("", "ai-msg", true);

          setTimeout(() => {
            let answer = "";
            const lowerQ = question.toLowerCase();
            if (lowerQ.includes("what") && lowerQ.includes("written")) {
              answer = `The text found in your image is:\n"${text.trim()}"`;
            } else if (lowerQ.includes("summarize")) {
              answer = `Summary: ${text.trim().slice(0, 100)}...`;
            } else {
              answer = `Simulated AI says: I read the text and it says: "${text.trim()}"`;
            }

            aiBubble.innerHTML = `<b>AI:</b> ${answer} <span class="timestamp">${getTimeStamp()}</span>`;
            chat.scrollTop = chat.scrollHeight;
            saveChat();
          }, 1500);
        })
        .catch(err => addMessage(`<b>AI:</b> Error reading image: ${err}`, "ai-msg"));

      document.getElementById("question").value = "";
    }
  </script>

</body>
</html>
